[package]
name = "gg-lan-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GG LAN native desktop client (Radmin VPN-style)"

[[bin]]
name = "gg-lan"
path = "src/main.rs"

[dependencies]
gg-lan-core = { workspace = true }
# "glow" is an OpenGL fallback renderer (kept for GPU-less machines, VMs and
# headless testing); wgpu remains the default.
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
dirs = "7"
